# De donde sale la IP real del visitante (punto 9).
#
# Esto NO estaba y se descubrio midiendo, con el tunel ya levantado: una
# peticion hecha desde la IP publica 181.177.197.253 quedo registrada en
# historial_accesos como 172.24.0.17, que es la IP del contenedor de
# cloudflared dentro de la red de Docker.
#
# La causa: **cloudflared no manda X-Forwarded-For**. Manda CF-Connecting-IP.
# Entonces el $proxy_add_x_forwarded_for de abajo no tenia nada que ampliar y
# quedaba con un solo elemento, la IP del propio cloudflared. Express, con
# trust proxy = 1, descarta ese unico salto y se queda sin nada que mirar.
#
# Por que importa, y mucho mas de lo que parece: el limitador de intentos de
# inicio de sesion cuenta POR IP. Con todas las peticiones de Internet
# llegando con la misma IP, **diez intentos fallidos de cualquiera dejan
# afuera a todo el mundo durante quince minutos**. El control pensado para
# frenar fuerza bruta se convierte en una forma de apagar el login del sistema
# desde afuera, gratis.
#
# El map elige: si viene CF-Connecting-IP, esa es la IP del visitante; si no
# viene —acceso local, sin tunel— se usa la cadena normal de nginx, asi que
# levantar el proyecto sin el perfil "tunel" sigue funcionando igual.
#
# Es seguro confiar en esa cabecera SOLO porque a este nginx nada mas se llega
# por el tunel o por 127.0.0.1: no hay puerto publicado en la LAN. Si algun dia
# se publica el puerto 80, esta linea pasa a ser falsificable y hay que
# cambiarla por una lista de IP de confianza de Cloudflare.
map $http_cf_connecting_ip $ip_del_visitante {
    ""      $proxy_add_x_forwarded_for;
    default $http_cf_connecting_ip;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No anunciar la version de nginx: es informacion gratis para quien
    # busque vulnerabilidades conocidas.
    server_tokens off;

    # Cabeceras de seguridad. El backend ya pone las suyas con Helmet, pero
    # los archivos estaticos no pasan por el backend.
    #
    # OJO, Y ESTO NO ES INTUITIVO: estas tres lineas estaban aca, a nivel del
    # servidor, con "always", y NO LLEGABAN A NINGUNA RESPUESTA de HTML ni de
    # archivos estaticos. Se comprobo pidiendolas:
    #
    #     $ curl -sI http://127.0.0.1:8080/
    #     Cache-Control: no-cache          <- y nada mas
    #
    # En nginx, si un bloque "location" tiene UN add_header propio, NO HEREDA
    # NINGUNO de los del padre. Los dos bloques que ponian un Cache-Control
    # —el de los archivos con hash y el de index.html— se estaban comiendo las
    # tres cabeceras de seguridad enteras. Y como "location /" hace try_files
    # hacia /index.html, hasta la pagina principal caia en ese bloque.
    #
    # El "always" no tiene nada que ver: eso solo decide si la cabecera se
    # agrega tambien en respuestas de error. No afecta la herencia.
    #
    # El efecto neto era el contrario del buscado: a /api/ llegaban DUPLICADAS
    # (las de Helmet mas estas, con dos Referrer-Policy de valor distinto) y al
    # HTML no llegaba ninguna. Justo al reves de lo que dice el comentario de
    # arriba.
    #
    # Por eso ahora van declaradas en cada bloque que sirve contenido, y NO a
    # nivel del servidor: /api/ ya las recibe de Helmet y no hay que
    # duplicarlas. Si manana se agrega un "location" nuevo que sirva contenido,
    # hay que repetirlas ahi. Es repetitivo y es la unica forma que nginx tiene
    # de hacer esto sin un modulo aparte.

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # La API va por el mismo origen. El navegador nunca habla directo con el
    # backend: nginx hace de intermediario por la red interna de Docker.
    # Por eso en produccion no hay CORS que configurar, y por eso el backend
    # no necesita puerto publicado hacia afuera.
    # nginx resuelve el nombre "backend" UNA VEZ, al arrancar, y se queda con
    # esa IP para siempre. Si el contenedor del backend se recrea
    # (docker compose up --build, por ejemplo) cambia de IP, y nginx sigue
    # hablandole a la vieja: 502 para todo, aunque el backend este sano.
    #
    # Pasó de verdad mientras se probaba el punto 14: el backend decia
    # "healthy" y la API devolvia 502. Reiniciar nginx lo arreglaba, que es
    # justamente la pista.
    #
    # 127.0.0.11 es el DNS interno de Docker. Con resolver + una variable en
    # proxy_pass, nginx vuelve a resolver el nombre cada diez segundos.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        # OJO: cuando proxy_pass lleva una variable, nginx NO agrega la parte
        # de la URI que matcheo el location. Hay que pasarla a mano, y
        # $request_uri es la original completa, con la cadena de consulta.
        set $destino_backend http://backend:3000;
        proxy_pass $destino_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # El backend registra la IP en el historial de accesos, y el limitador
        # de login cuenta por IP. Sin esta cabecera guardaria siempre la IP del
        # contenedor de nginx; con ella pero sin el map de arriba, guardaba la
        # del contenedor de cloudflared. Ver el comentario del map.
        proxy_set_header X-Forwarded-For   $ip_del_visitante;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Los archivos con hash en el nombre no cambian nunca: se cachean fuerte.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Repetidas a proposito: ver el comentario de arriba.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    # index.html no se cachea: es el que apunta a los bundles nuevos despues
    # de cada despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache";
        # Este es el bloque que importa: es el que sirve la pagina, y era el
        # que se quedaba sin ninguna cabecera de seguridad.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Angular maneja el ruteo del lado del cliente: cualquier ruta que no
    # sea un archivo real tiene que devolver index.html, o recargar en
    # /platos daria 404.
    location / {
        # Para un archivo real que no sea un activo con hash (robots.txt,
        # manifest.json). Cuando cae en try_files hacia /index.html, las pone
        # el bloque de arriba.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
