server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # No anunciar la version de nginx: es informacion gratis para quien
    # busque vulnerabilidades conocidas.
    server_tokens off;

    # Cabeceras de seguridad. El backend ya pone las suyas con Helmet, pero
    # los archivos estaticos no pasan por el backend.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # La API va por el mismo origen. El navegador nunca habla directo con el
    # backend: nginx hace de intermediario por la red interna de Docker.
    # Por eso en produccion no hay CORS que configurar, y por eso el backend
    # no necesita puerto publicado hacia afuera.
    location /api/ {
        proxy_pass http://backend:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # El backend registra la IP en el historial de accesos. Sin esta
        # cabecera guardaria siempre la IP del contenedor de nginx.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Los archivos con hash en el nombre no cambian nunca: se cachean fuerte.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html no se cachea: es el que apunta a los bundles nuevos despues
    # de cada despliegue.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Angular maneja el ruteo del lado del cliente: cualquier ruta que no
    # sea un archivo real tiene que devolver index.html, o recargar en
    # /platos daria 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
