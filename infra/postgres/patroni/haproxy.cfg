# Punto de entrada unico al cluster con failover.
#
# La idea que hay que poder explicar: HAProxy NO sabe cual es el primario.
# Los tres nodos estan listados en los dos grupos, y a cada uno le pregunta
# por la API de Patroni (puerto 8008):
#
#   GET /primary  -> responde 200 solo el lider   -> se lleva las escrituras
#   GET /replica  -> responden 200 las replicas   -> se llevan las lecturas
#
# Por eso una promocion no necesita que nadie toque esta configuracion: el
# nodo que gana la eleccion empieza a contestar 200 en /primary y HAProxy le
# manda el trafico en el siguiente chequeo.

global
    maxconn 300

defaults
    log     global
    mode    tcp
    retries 2
    timeout client  30m
    timeout connect 4s
    timeout server  30m
    timeout check   5s

listen stats
    mode http
    bind *:7000
    stats enable
    stats uri /

listen postgres_escritura
    bind *:5000
    option httpchk GET /primary
    http-check expect status 200
    # on-marked-down shutdown-sessions: cuando un nodo deja de ser primario,
    # se cortan las conexiones abiertas contra el. Sin esto, una sesion vieja
    # sigue hablandole al nodo degradado y las escrituras fallan en silencio.
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg1 pg1:5432 maxconn 100 check port 8008
    server pg2 pg2:5432 maxconn 100 check port 8008
    server pg3 pg3:5432 maxconn 100 check port 8008

listen postgres_lectura
    bind *:5001
    option httpchk GET /replica
    http-check expect status 200
    default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
    server pg1 pg1:5432 maxconn 100 check port 8008
    server pg2 pg2:5432 maxconn 100 check port 8008
    server pg3 pg3:5432 maxconn 100 check port 8008
