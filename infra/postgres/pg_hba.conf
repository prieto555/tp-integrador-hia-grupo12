# Autenticacion de PostgreSQL (punto 6).
#
# Hasta ahora este archivo lo generaba la imagen adentro del volumen de datos.
# Eso tiene dos problemas: no esta versionado, y para cambiarlo hay que entrar
# al contenedor y editarlo a mano, con lo cual el cambio existe en esta maquina
# y en ninguna otra.
#
# Ahora se monta desde el repositorio y el servicio arranca con
#   -c hba_file=/etc/postgresql/pg_hba.conf
# asi que quien levante el proyecto obtiene exactamente estas reglas.
#
# El orden importa: PostgreSQL usa LA PRIMERA linea que coincide y no sigue
# mirando. Por eso las especificas van arriba y la general abajo.

# TIPO  BASE            USUARIO         ORIGEN                  METODO

# ---------------------------------------------------------------------------
# Conexiones desde adentro del propio contenedor.
#
# Quedan en "trust" como las dejaba la imagen. No es un agujero: para usar el
# socket local ya hay que tener shell adentro del contenedor, y quien tiene eso
# puede leer los archivos de datos igual. Lo que si permite es que
# "docker exec ... psql -U restoya" funcione sin contrasena, de lo que dependen
# el healthcheck y los scripts del repositorio.
# ---------------------------------------------------------------------------
local   all             all                                     trust
host    all             all             127.0.0.1/32            trust
host    all             all             ::1/128                 trust
local   replication     all                                     trust
host    replication     all             127.0.0.1/32            trust
host    replication     all             ::1/128                 trust

# ---------------------------------------------------------------------------
# Replicacion por streaming (punto 6).
#
# Solo el rol "replicador", que NO puede leer ni escribir datos: tiene el
# atributo REPLICATION y nada mas. Si alguien se queda con esa contrasena,
# puede copiarse la base entera, que ya es bastante, pero no puede conectarse
# a restoyadb a mirar una tabla.
#
# "samenet" significa cualquier direccion de las subredes a las que el servidor
# esta conectado: en la practica, la red interna de Docker. Se prefiere a poner
# 172.x.0.0/16 a mano porque esa subred la elige Docker y cambia.
# ---------------------------------------------------------------------------
host    replication     replicador      samenet                 scram-sha-256

# ---------------------------------------------------------------------------
# Todo lo demas: contrasena cifrada. La base no publica puerto fuera de
# 127.0.0.1, asi que "all" en la columna de origen es la red interna de Docker
# mas el reenvio del host, no Internet.
# ---------------------------------------------------------------------------
host    all             all             all                     scram-sha-256
