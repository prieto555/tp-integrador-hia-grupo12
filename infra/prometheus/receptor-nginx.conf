# Receptor de alertas para la demostracion del punto 10 (E10-06).
#
# Alertmanager manda la alerta por POST a un webhook. Este servicio la acepta,
# la deja escrita en su registro y responde 204. Es la evidencia de que el
# aviso no se quedo en Prometheus: salio, viajo y llego a destino.
#
# POR QUE NO ES UN CORREO. Mandar correo exige una contrasena de aplicacion de
# Gmail, y eso es un secreto que no puede entrar al repositorio. Ademas, para
# lo que hay que demostrar da igual: lo que se evalua es que la regla salte y
# que el aviso llegue, no que Gmail ande.
#
# QUE VA A IR ACA DESPUES. El receptor definitivo es un flujo de n8n
# (punto 13), que es el que ya sabe mandar correo y abrir un ticket en Mantis
# (punto 11). Cuando exista, se cambia la URL en alertmanager.yml y este
# servicio se borra. Hasta entonces, esto cierra el circuito.

# El cuerpo del POST se registra entero: es el JSON que manda Alertmanager,
# con el nombre de la alerta, su severidad y sus anotaciones.
log_format alertas escape=none
    '[$time_iso8601] $request_method $uri -> $status  ($request_length bytes)\n'
    '$request_body\n';

server {
    listen 8080;
    server_name _;

    access_log /dev/stdout alertas;

    location / {
        # El proxy_pass esta para que nginx LEA el cuerpo de la peticion. Con
        # un "return 204" directo no lo lee, y $request_body sale vacio en el
        # registro, que es justamente lo que hay que mostrar.
        client_body_buffer_size 256k;
        proxy_pass http://127.0.0.1:8099;
    }
}

server {
    listen 127.0.0.1:8099;
    # 204: recibido, nada que devolver. Alertmanager lo da por entregado.
    location / {
        return 204;
    }
}
